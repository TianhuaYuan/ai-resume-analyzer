# CD 流水线：push main/develop 自动部署，workflow_dispatch 手动选环境

name: CD

on:
  push:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: "部署目标环境"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Docker 镜像 tag（留空使用 git short SHA）"
        required: false
        default: ""
        type: string
      skip_tests:
        description: "跳过测试（紧急修复）"
        required: false
        default: false
        type: boolean

# 同一环境串行部署（不取消正在进行的部署）
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/ai-resume-analyzer
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      deploy_host: ${{ steps.env.outputs.deploy_host }}
      deploy_path: ${{ steps.env.outputs.deploy_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          # 手动触发 → 使用输入参数
          # push develop → staging
          # push main → production
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            ENV="staging"
          else
            ENV="production"
          fi

          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_TAG="${TAG:0:12}"

          case "$ENV" in
            staging)
              HOST="${{ secrets.STAGING_DEPLOY_HOST }}"
              PATH_="${{ secrets.STAGING_DEPLOY_PATH || '/opt/ai-resume-analyzer-staging' }}"
              ;;
            production)
              HOST="${{ secrets.PRODUCTION_DEPLOY_HOST }}"
              PATH_="${{ secrets.PRODUCTION_DEPLOY_PATH || '/opt/ai-resume-analyzer' }}"
              ;;
          esac

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$SHORT_TAG" >> $GITHUB_OUTPUT
          echo "deploy_host=$HOST" >> $GITHUB_OUTPUT
          echo "deploy_path=$PATH_" >> $GITHUB_OUTPUT

          {
          echo "### Deploy Plan"
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Environment | \`$ENV\` |"
          echo "| Image Tag | \`$SHORT_TAG\` |"
          echo "| Deploy Host | \`$HOST\` |"
          echo "| Deploy Path | \`$PATH_\` |"
          } >> $GITHUB_STEP_SUMMARY

  test:
    needs: prepare
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install & test backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite

          python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    needs: [prepare, test]
    if: needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}-backend:${{ needs.prepare.outputs.image_tag }}
            ${{ env.DOCKER_REPO }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}-frontend:${{ needs.prepare.outputs.image_tag }}
            ${{ env.DOCKER_REPO }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push summary
        run: |
          {
          echo "### Images Pushed"
          echo "- \`${{ env.DOCKER_REPO }}-backend:${{ needs.prepare.outputs.image_tag }}\`"
          echo "- \`${{ env.DOCKER_REPO }}-frontend:${{ needs.prepare.outputs.image_tag }}\`"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: [prepare, build-and-push]
    if: needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.deploy_host }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.prepare.outputs.deploy_host }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          connect_timeout: 30s
          command_timeout: 300s
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ needs.prepare.outputs.deploy_path }}"
            IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
            DOCKER_REPO="${{ env.DOCKER_REPO }}"
            DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}"
            ENV="${{ needs.prepare.outputs.environment }}"

            echo "=== Deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "Env=$ENV Tag=$IMAGE_TAG Path=$DEPLOY_PATH"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "First deploy: creating docker-compose.prod.yml..."
              # 如果有 deploy.sh 就用它初始化，否则从仓库克隆
              if [ -d .git ]; then
                git pull origin main -- deploy/
              else
                git clone --depth 1 --filter=blob:none --sparse \
                  https://github.com/${{ github.repository }}.git temp-deploy
                cd temp-deploy && git sparse-checkout set deploy && cd ..
                cp temp-deploy/deploy/docker-compose.prod.yml .
                cp temp-deploy/deploy/deploy.sh .
                chmod +x deploy.sh
                rm -rf temp-deploy
              fi
            fi

            echo "Pulling images..."
            docker pull "${DOCKER_REGISTRY}/${DOCKER_REPO}-backend:${IMAGE_TAG}"
            docker pull "${DOCKER_REGISTRY}/${DOCKER_REPO}-frontend:${IMAGE_TAG}"

            OLD_BACKEND=$(docker inspect --format='{{.Config.Image}}' resume-backend 2>/dev/null || echo "none")
            OLD_FRONTEND=$(docker inspect --format='{{.Config.Image}}' resume-frontend 2>/dev/null || echo "none")

            export DOCKER_REGISTRY DOCKER_REPO IMAGE_TAG

            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for backend health check..."
            MAX_WAIT=120
            ELAPSED=0
            HEALTH="unknown"
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' resume-backend 2>/dev/null || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "Backend healthy after ${ELAPSED}s"
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
              echo "  waiting... ${ELAPSED}s (status=$HEALTH)"
            done

            if [ "$HEALTH" != "healthy" ]; then
              echo "ERROR: Backend unhealthy after ${MAX_WAIT}s"
              echo "--- Last 50 lines of backend logs ---"
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              echo "--- Rolling back ---"
              if [ "$OLD_BACKEND" != "none" ]; then
                docker tag "${DOCKER_REGISTRY}/${DOCKER_REPO}-backend:${IMAGE_TAG}" "${OLD_BACKEND}" 2>/dev/null || true
                docker compose -f docker-compose.prod.yml up -d
              fi
              exit 1
            fi

            docker image prune -f --filter "dangling=true" 2>/dev/null || true
            {
              echo "ROLLBACK_TAG=$IMAGE_TAG"
              echo "OLD_BACKEND=$OLD_BACKEND"
              echo "OLD_FRONTEND=$OLD_FRONTEND"
              echo "TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > .rollback-info

            echo "=== Deploy Complete ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.prepare.outputs.deploy_host }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          connect_timeout: 15s
          command_timeout: 30s
          script: |
            echo "=== Post-deploy Verification ==="
            echo "--- Containers ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "resume-|NAMES"

            echo "--- Health ---"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "000")
            echo "Backend: HTTP $HTTP"
            FE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ || echo "000")
            echo "Frontend: HTTP $FE"

            echo "--- Disk ---"
            df -h / | tail -1
            echo "=== Verification Complete ==="

  notify:
    needs: [prepare, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notification (failure)
        if: needs.deploy.result == 'failure'
        run: |
          {
          echo "### :x: Deployment Failed"
          echo "- **Environment**: ${{ needs.prepare.outputs.environment }}"
          echo "- **Tag**: ${{ needs.prepare.outputs.image_tag }}"
          echo "- **Commit**: ${{ github.event.head_commit.message }}"
          echo "- **Author**: ${{ github.actor }}"
          echo "- [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY

          # 取消注释启用钉钉通知
          # curl -s -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"[CD] FAILED | Env=${{ needs.prepare.outputs.environment }} | Tag=${{ needs.prepare.outputs.image_tag }} | By ${{ github.actor }}\"}}"

          # 取消注释启用飞书通知
          # curl -s -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"[CD] FAILED | Env=${{ needs.prepare.outputs.environment }} | Tag=${{ needs.prepare.outputs.image_tag }}\"}}"

      - name: Notification (success)
        if: needs.deploy.result == 'success'
        run: |
          {
          echo "### :white_check_mark: Deployment Successful"
          echo "- **Environment**: ${{ needs.prepare.outputs.environment }}"
          echo "- **Tag**: ${{ needs.prepare.outputs.image_tag }}"
          echo "- **Host**: ${{ needs.prepare.outputs.deploy_host }}"
          } >> $GITHUB_STEP_SUMMARY
