# CD 流水线：push main 自动部署到生产环境

name: CD

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker 镜像 tag（留空使用 git short SHA）"
        required: false
        default: ""
        type: string
      skip_tests:
        description: "跳过测试（紧急修复）"
        required: false
        default: false
        type: boolean

# 同一环境串行部署（不取消正在进行的部署）
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_REPO: ${{ secrets.DOCKER_REPO || format('{0}/ai-resume-analyzer', secrets.DOCKER_USERNAME) }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          # P1-3：对 inputs.image_tag 做白名单校验，防止 workflow_dispatch 注入
          RAW_TAG="${{ inputs.image_tag || github.sha }}"
          if ! echo "$RAW_TAG" | grep -Eq '^[a-zA-Z0-9_.-]+$'; then
            echo "ERROR: image_tag contains invalid characters: $RAW_TAG"
            echo "Allowed: [a-zA-Z0-9_.-]"
            exit 1
          fi
          TAG="$RAW_TAG"
          SHORT_TAG="${TAG:0:12}"

          echo "environment=production" >> $GITHUB_OUTPUT
          echo "image_tag=$SHORT_TAG" >> $GITHUB_OUTPUT

          {
          echo "### Deploy Plan"
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Environment | \`production\` |"
          echo "| Image Tag | \`$SHORT_TAG\` |"
          } >> $GITHUB_STEP_SUMMARY

  test:
    needs: prepare
    if: inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install & test backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite

          python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    needs: [prepare, test]
    if: needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-backend:${{ needs.prepare.outputs.image_tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-frontend:${{ needs.prepare.outputs.image_tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push summary
        run: |
          {
          echo "### Images Pushed"
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-backend:${{ needs.prepare.outputs.image_tag }}\`"
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-frontend:${{ needs.prepare.outputs.image_tag }}\`"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: [prepare, build-and-push]
    if: needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    steps:
      - name: Resolve host and path
        id: deploy_target
        run: |
          echo "host=${{ secrets.PRODUCTION_DEPLOY_HOST }}" >> $GITHUB_OUTPUT
          echo "path=${{ secrets.PRODUCTION_DEPLOY_PATH || '/opt/ai-resume-analyzer' }}" >> $GITHUB_OUTPUT

      - name: Setup SSH agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Deploy to server
        run: |
          SSH_DEST="${{ secrets.DEPLOY_USER || 'root' }}@${{ steps.deploy_target.outputs.host }}"
          SSH_PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"

          ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_DEST" bash -s <<'ENDSSH'
            set -euo pipefail

            DEPLOY_PATH="${{ steps.deploy_target.outputs.path }}"
            IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
            DOCKER_REPO="${{ env.DOCKER_REPO }}"
            DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}"
            ENV="${{ needs.prepare.outputs.environment }}"

            echo "=== Deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "Env=$ENV Tag=$IMAGE_TAG Path=$DEPLOY_PATH"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "First deploy: cloning docker-compose.prod.yml..."
              git clone --depth 1 --filter=blob:none --sparse \
                https://github.com/${{ github.repository }}.git temp-deploy
              cp temp-deploy/docker-compose.prod.yml .
              rm -rf temp-deploy
            fi

            echo "Pulling images..."
            # 先登录私有仓库
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              "${{ secrets.DOCKER_REGISTRY }}" \
              -u "${{ secrets.ACR_USERNAME }}" \
              --password-stdin 2>/dev/null || echo "Login skipped (public images only)"

            _pull_with_retry() {
              local img="$1" max=3 i=0 delay=15
              while [ $i -lt $max ]; do
                if docker pull "$img"; then
                  return 0
                fi
                i=$((i + 1))
                echo "Pull failed (attempt $i/$max), retrying in ${delay}s..."
                sleep $delay
                delay=$((delay * 2))
              done
              echo "ERROR: Failed to pull $img after $max attempts"
              return 1
            }
            _pull_with_retry "${DOCKER_REGISTRY}/${DOCKER_REPO}-backend:${IMAGE_TAG}" || exit 1
            _pull_with_retry "${DOCKER_REGISTRY}/${DOCKER_REPO}-frontend:${IMAGE_TAG}" || exit 1

            OLD_BACKEND=$(docker inspect --format='{{.Config.Image}}' resume-backend 2>/dev/null || echo "none")
            OLD_FRONTEND=$(docker inspect --format='{{.Config.Image}}' resume-frontend 2>/dev/null || echo "none")
            OLD_BACKEND_TAG="${OLD_BACKEND##*:}"
            OLD_FRONTEND_TAG="${OLD_FRONTEND##*:}"
            # 确保 old tag 不包含 registry 前缀中的冒号
            [ "$OLD_BACKEND_TAG" = "$OLD_BACKEND" ] && OLD_BACKEND_TAG=""
            [ "$OLD_FRONTEND_TAG" = "$OLD_FRONTEND" ] && OLD_FRONTEND_TAG=""

            export DOCKER_REGISTRY DOCKER_REPO IMAGE_TAG

            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi

            docker compose -f docker-compose.prod.yml up -d --pull never --remove-orphans

            echo "Waiting for backend health check..."
            MAX_WAIT=120
            ELAPSED=0
            HEALTH="unknown"
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' resume-backend 2>/dev/null || echo "unknown")
              if [ "$HEALTH" = "healthy" ]; then
                echo "Backend healthy after ${ELAPSED}s"
                echo "Running database migrations..."
                docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head || echo "WARNING: Migration failed (will retry on next deploy)"
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
              echo "  waiting... ${ELAPSED}s (status=$HEALTH)"
            done

            if [ "$HEALTH" != "healthy" ]; then
              echo "ERROR: Backend unhealthy after ${MAX_WAIT}s"
              echo "--- Last 50 lines of backend logs ---"
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              echo "--- Rolling back ---"
              if [ -n "$OLD_BACKEND_TAG" ]; then
                echo "Reverting backend: ${OLD_BACKEND_TAG}"
                docker pull "${DOCKER_REGISTRY}/${DOCKER_REPO}-backend:${OLD_BACKEND_TAG}" 2>/dev/null || true
              fi
              if [ -n "$OLD_FRONTEND_TAG" ]; then
                echo "Reverting frontend: ${OLD_FRONTEND_TAG}"
                docker pull "${DOCKER_REGISTRY}/${DOCKER_REPO}-frontend:${OLD_FRONTEND_TAG}" 2>/dev/null || true
              fi
              IMAGE_TAG="${OLD_BACKEND_TAG:-$IMAGE_TAG}"
              export IMAGE_TAG
              docker compose -f docker-compose.prod.yml up -d --pull never
              exit 1
            fi

            docker image prune -f --filter "until=168h" 2>/dev/null || true
            {
              echo "ROLLBACK_BACKEND_TAG=${OLD_BACKEND_TAG:-$IMAGE_TAG}"
              echo "ROLLBACK_FRONTEND_TAG=${OLD_FRONTEND_TAG:-$IMAGE_TAG}"
              echo "TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > .rollback-info

            echo "=== Deploy Complete ==="
          ENDSSH

      - name: Setup SSH agent for verify
        run: |
          # Same key from deploy step is still in agent; ensure loaded
          if [ -z "$SSH_AUTH_SOCK" ] || ! ssh-add -l &>/dev/null; then
            mkdir -p ~/.ssh
            echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/deploy_key
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          fi

      - name: Verify deployment
        run: |
          SSH_DEST="${{ secrets.DEPLOY_USER || 'root' }}@${{ steps.deploy_target.outputs.host }}"
          SSH_PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"

          ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_DEST" bash -s <<'ENDSSH'
            echo "=== Post-deploy Verification ==="
            echo "--- Containers ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "resume-|NAMES"

            echo "--- Health ---"
            # P1-2：backend 不再暴露端口到宿主机，通过 docker exec 在容器内验证
            HTTP=$(docker exec resume-backend curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/ 2>/dev/null || echo "000")
            echo "Backend: HTTP $HTTP"
            FE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:80/ || echo "000")
            echo "Frontend: HTTP $FE"
            # 非 200/302 视为异常
            if [ "$HTTP" != "200" ] && [ "$HTTP" != "302" ]; then
              echo "WARNING: Backend returned $HTTP (expected 200/302)"
              exit 1
            fi

            echo "--- Disk ---"
            df -h / | tail -1
            echo "=== Verification Complete ==="
          ENDSSH

  notify:
    needs: [prepare, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notification (failure)
        if: needs.deploy.result == 'failure'
        run: |
          {
          echo "### :x: Deployment Failed"
          echo "- **Environment**: ${{ needs.prepare.outputs.environment }}"
          echo "- **Tag**: ${{ needs.prepare.outputs.image_tag }}"
          echo "- **Commit**: ${{ github.event.head_commit.message }}"
          echo "- **Author**: ${{ github.actor }}"
          echo "- [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY


      - name: Notification (success)
        if: needs.deploy.result == 'success'
        run: |
          {
          echo "### :white_check_mark: Deployment Successful"
          echo "- **Environment**: ${{ needs.prepare.outputs.environment }}"
          echo "- **Tag**: ${{ needs.prepare.outputs.image_tag }}"
          } >> $GITHUB_STEP_SUMMARY
