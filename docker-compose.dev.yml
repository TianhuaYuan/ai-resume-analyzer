# 开发环境：docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file backend/.env.dev up

services:
  mysql:
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: devpassword

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: resume-backend-dev
    env_file:
      - ./backend/.env.dev
    environment:
      DATABASE_URL: mysql+aiomysql://root:devpassword@mysql:3306/resume_ai
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_data
    ports:
      - "8000:8000"
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
      --log-level debug
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: resume-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
