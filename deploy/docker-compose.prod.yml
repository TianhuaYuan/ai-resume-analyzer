# CD 生产部署：docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  mysql:
    image: mysql:8.0
    container_name: resume-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: resume_ai
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - resume-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_REPO:-ai-resume-analyzer}-backend:${IMAGE_TAG:-latest}
    container_name: resume-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/resume_ai
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - resume-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  frontend:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_REPO:-ai-resume-analyzer}-frontend:${IMAGE_TAG:-latest}
    container_name: resume-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    networks:
      - resume-network
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  chroma_data:
    driver: local

networks:
  resume-network:
    driver: bridge
