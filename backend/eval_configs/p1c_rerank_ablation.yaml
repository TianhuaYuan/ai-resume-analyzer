# =============================================================================
# P1-C 实验配置：Rerank 消融实验（Ablation）
# =============================================================================
# 目的：量化 Rerank（百炼 qwen3-vl-rerank Cross-Encoder）对 composite 的贡献。
# 方法：对照组用 P0 最优参数（含 rerank），实验组关闭 rerank 筛选
#       （rerank_final_top_k = rerank_input_top_k，即 rerank 不过滤任何候选）。
# 预算：2 组 × 64 tuning QA × 3 Judge = 384 LLM 调用，~$0.1，~15min
# 前置条件：P0 实验完成，已确定最优参数
# =============================================================================

name: p1c_rerank_ablation
dataset: ../eval_data/golden_set_v2.json
strategy: grid
seed: 42
notes: |
  Rerank 消融：对比"有 rerank 筛选"vs"无 rerank 筛选"对 composite 的影响。
  rerank_final_top_k=5（P0 最优）vs rerank_final_top_k=20（=rerank_input_top_k，不筛选）。

# TODO: P0 完成后替换为 P0 最优参数
baseline_params:
  chunk_size: 1200
  overlap: 50
  dense_top_k: 20
  sparse_top_k: 20
  hybrid_top_k: 20
  rrf_k: 100
  rerank_input_top_k: 20
  rerank_final_top_k: 5
  rerank_truncation: 400
  reject_threshold: 0.3
  generate_temperature: 0.3

phases:
  - name: with_rerank
    description: 有 rerank 筛选（P0 最优配置，rerank_final_top_k=5）
    strategy: single
    parameters:
      rerank_final_top_k: 5

  - name: without_rerank
    description: 无 rerank 筛选（rerank_final_top_k=rerank_input_top_k=20，rerank 不过滤）
    strategy: single
    parameters:
      rerank_final_top_k: 20
