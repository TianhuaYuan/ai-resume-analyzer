# =============================================================================
# P0 实验配置：单变量参数扫描（OAT, One-At-a-Time）
# =============================================================================
# 预算：19 参数组 × 64 tuning QA × 3 Judge = 3648 LLM 调用，~$0.9，~1.5h
# 数据集：golden_set_v2.json (94 samples: 64 tuning + 30 eval)
# Judge：DeepSeek (deepseek-v4-flash)，每条样本 3 次评分取均值
# =============================================================================
#
# 扫描维度（7 个 Phase，无依赖，可并发）：
#   1. baseline         — 全默认参数基线（1 组）
#   2. scan_chunk_size  — [300, 500, 800, 1200]（4 组）
#   3. scan_overlap     — [0, 50, 100]（3 组）
#   4. scan_rrf_k       — [60, 100, 150]（3 组）
#   5. scan_rerank_input_top_k  — [10, 15, 20]（3 组）
#   6. scan_rerank_final_top_k  — [3, 5, 8]（3 组）
#   7. scan_reject_threshold    — [0.3, 0.5]（2 组）
#   合计：1 + 4 + 3 + 3 + 3 + 3 + 2 = 19 组
#
# 每个 Phase 仅扫描一个参数，其余参数从 baseline_params 继承。
# Scheduler 自动对同 Phase 内多参数组合并发执行（Semaphore 限流 Judge API）。

name: p0_param_scan
dataset: ../eval_data/golden_set_v2.json
strategy: grid
seed: 42
notes: |
  P0 单变量扫描：确认每个参数对 composite 的影响方向和幅度。
  结果用于 P1 阶段的消融实验（C Rerank Ablation / G BM25 Ablation / A 传统 vs Agentic）。

# 实验级基线参数（与 RagParams 默认值一致 = 当前生产配置）
baseline_params:
  chunk_size: 1200
  overlap: 50
  dense_top_k: 20
  sparse_top_k: 20
  hybrid_top_k: 20
  rrf_k: 100
  rerank_input_top_k: 20
  rerank_final_top_k: 5
  rerank_truncation: 400
  reject_threshold: 0.3
  generate_temperature: 0.3

phases:
  # ── 1. 基线 ──
  - name: baseline
    description: 全默认参数基线（当前生产配置）
    strategy: single
    parameters:
      chunk_size: 1200
      overlap: 50

  # ── 2. 分块大小扫描 ──
  - name: scan_chunk_size
    description: chunk_size 对检索粒度的影响（300 粗→1200 细）
    strategy: grid
    parameters:
      chunk_size: [300, 500, 800, 1200]

  # ── 3. 分块重叠扫描 ──
  - name: scan_overlap
    description: overlap 对边界信息保留的影响
    strategy: grid
    parameters:
      overlap: [0, 50, 100]

  # ── 4. RRF 平滑常数扫描 ──
  - name: scan_rrf_k
    description: rrf_k 对稠密/稀疏融合权重的影响（k 小→排名敏感；k 大→均匀）
    strategy: grid
    parameters:
      rrf_k: [60, 100, 150]

  # ── 5. Rerank 输入候选数扫描 ──
  - name: scan_rerank_input_top_k
    description: rerank_input_top_k 对精排覆盖面的影响
    strategy: grid
    parameters:
      rerank_input_top_k: [10, 15, 20]

  # ── 6. Rerank 最终保留数扫描 ──
  - name: scan_rerank_final_top_k
    description: rerank_final_top_k 对生成上下文长度的影响
    strategy: grid
    parameters:
      rerank_final_top_k: [3, 5, 8]

  # ── 7. 拒答阈值扫描 ──
  - name: scan_reject_threshold
    description: reject_threshold 对拒答激进程度的影响（0.3 宽松→0.5 严格）
    strategy: grid
    parameters:
      reject_threshold: [0.3, 0.5]
