<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: var(--margin); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #2d3748;
    background: #fff;
    padding: var(--margin);
  }
  .resume-container { max-width: 820px; margin: 0 auto; }

  /* ── 头部：姓名 + 求职意向 + 联系方式 ── */
  .basic-header {
    padding-bottom: 14px;
    margin-bottom: var(--section-spacing);
    border-bottom: 2px solid var(--accent-color);
  }
  .basic-name {
    font-size: calc(var(--font-size) * 1.9);
    font-weight: 700;
    letter-spacing: 2px;
    color: #1a202c;
  }
  .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    font-size: calc(var(--font-size) * 1.1);
    margin-top: 4px;
  }
  .basic-contact {
    color: #4a5568;
    font-size: calc(var(--font-size) * 0.95);
    margin-top: 6px;
    line-height: 1.8;
  }
  .basic-summary {
    color: #4a5568;
    margin-top: 8px;
    font-size: calc(var(--font-size) * 0.98);
    text-align: justify;
  }

  /* ── 章节：标题 + 内容 ── */
  .module {
    margin-bottom: var(--section-spacing);
    padding-bottom: 8px;
    break-inside: avoid;
  }
  .module-title {
    font-size: calc(var(--font-size) * 1.12);
    color: #1a202c;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .module-title::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--accent-color);
    opacity: 0.35;
  }
  .module-content { padding-left: 2px; }

  /* ── 条目通用 ── */
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: calc(var(--section-spacing) * 1.1);
    break-inside: avoid;
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 600;
    color: #1a202c;
    font-size: calc(var(--font-size) * 1.02);
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #a0aec0;
    font-size: calc(var(--font-size) * 0.88);
    white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color);
    font-size: calc(var(--font-size) * 0.95);
    font-weight: 500;
    margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #4a5568;
    margin-top: 3px;
    text-align: justify;
  }
  .work-achievements {
    padding-left: 22px;
    margin-top: 4px;
    color: #4a5568;
  }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }

  /* ── 技能：标签化 ── */
  .skill-cat { margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; }
  .skill-name { font-weight: 600; color: #1a202c; min-width: 88px; }
  .skill-item {
    display: inline-block;
    background: rgba(37, 99, 235, 0.08);
    border: 1px solid rgba(37, 99, 235, 0.2);
    color: var(--accent-color);
    border-radius: 4px;
    padding: 1px 8px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.92);
  }

  .proj-tech { color: #718096; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #4a5568; }
  .honor-date, .rec-contact { color: #a0aec0; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #4a5568; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 600; color: #1a202c; }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
