<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: var(--margin); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #333;
    background: #fff;
    padding: var(--margin);
  }
  .resume-container {
    max-width: 800px;
    margin: 0 auto;
  }
  .module {
    margin-bottom: var(--spacing);
    padding-bottom: var(--spacing);
    border-bottom: 1px solid #eee;
  }
  .module:last-child { border-bottom: none; }
  .module-title {
    font-size: calc(var(--font-size) * 1.15);
    color: var(--accent-color);
    border-left: 3px solid var(--accent-color);
    padding-left: 8px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .module-content { padding-left: 11px; }
  .basic-name {
    font-size: calc(var(--font-size) * 1.6);
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
  }
  .basic-contact {
    color: #666;
    font-size: calc(var(--font-size) * 0.9);
    margin-bottom: 4px;
  }
  .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .basic-summary { color: #555; }
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: var(--section-spacing);
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 600;
    color: #1a1a1a;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #999;
    font-size: calc(var(--font-size) * 0.9);
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: #555;
    font-size: calc(var(--font-size) * 0.95);
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #555;
    margin-top: 2px;
  }
  .work-achievements { padding-left: 20px; margin-top: 2px; }
  .work-achievements li { color: #555; }
  .proj-tech { color: #777; font-size: calc(var(--font-size) * 0.9); margin-top: 2px; }
  .skill-cat { margin-bottom: 2px; }
  .skill-name { font-weight: 600; color: #444; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 2px; }
  .honor-date, .rec-contact { color: #777; font-size: calc(var(--font-size) * 0.9); }
  .interests { color: #555; }
  .social-link { color: #555; }
  .fallback-row { color: #555; margin-bottom: 2px; }
  .fallback-key { font-weight: 600; }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
