<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: var(--margin); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "Times New Roman", serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #2c2c2c;
    background: #fff;
    padding: 0;
  }
  .resume-header {
    background: var(--accent-color);
    color: #fff;
    padding: 30px 40px;
  }
  .resume-header .basic-name {
    font-size: calc(var(--font-size) * 1.8);
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .resume-header .basic-contact {
    color: rgba(255,255,255,0.9);
    font-size: calc(var(--font-size) * 0.9);
  }
  .resume-header .basic-job-title {
    color: rgba(255,255,255,0.95);
    font-weight: 500;
    margin-top: 4px;
  }
  .resume-body {
    padding: var(--margin);
    max-width: 800px;
    margin: 0 auto;
  }
  .module {
    margin-bottom: var(--spacing);
  }
  .module-title {
    font-size: calc(var(--font-size) * 1.1);
    color: var(--accent-color);
    border-bottom: 2px solid var(--accent-color);
    padding-bottom: 3px;
    margin-bottom: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .module-content { }
  .basic-summary { color: #555; margin-top: 6px; }
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: var(--section-spacing);
    padding-left: 12px;
    border-left: 2px solid #e0e0e0;
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 700;
    color: #1a1a1a;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #888;
    font-size: calc(var(--font-size) * 0.9);
    font-style: italic;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: #555;
    font-size: calc(var(--font-size) * 0.95);
    font-weight: 500;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #555;
    margin-top: 3px;
  }
  .work-achievements { padding-left: 20px; margin-top: 3px; }
  .work-achievements li { color: #555; margin-bottom: 2px; }
  .proj-tech { color: #777; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .skill-cat {
    margin-bottom: 3px;
    padding: 4px 8px;
    background: #f5f5f5;
    border-radius: 2px;
  }
  .skill-name { font-weight: 700; color: var(--accent-color); }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 3px; }
  .honor-title, .cert-item strong, .pub-title { color: #2c2c2c; }
  .honor-date, .rec-contact { color: #888; font-size: calc(var(--font-size) * 0.9); }
  .interests {
    color: #555;
    padding: 6px 10px;
    background: #f9f9f9;
    border-radius: 2px;
  }
  .social-link { color: #555; }
  .fallback-row { color: #555; margin-bottom: 2px; }
  .fallback-key { font-weight: 700; color: #2c2c2c; }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
