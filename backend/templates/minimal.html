<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: var(--margin); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #222;
    background: #fff;
    padding: var(--margin);
  }
  .resume-container {
    max-width: 760px;
    margin: 0 auto;
  }
  .module {
    margin-bottom: calc(var(--spacing) * 1.5);
  }
  .module-title {
    font-size: calc(var(--font-size) * 1.1);
    color: #222;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-weight: 400;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
  }
  .module-content { }
  .basic-name {
    font-size: calc(var(--font-size) * 2);
    font-weight: 300;
    color: #111;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .basic-contact {
    color: #888;
    font-size: calc(var(--font-size) * 0.9);
    margin-bottom: 6px;
  }
  .basic-job-title {
    color: #555;
    font-weight: 400;
    margin-bottom: 4px;
  }
  .basic-summary { color: #666; font-weight: 300; }
  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: var(--section-spacing); }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 500;
    color: #222;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #aaa;
    font-size: calc(var(--font-size) * 0.85);
    font-weight: 300;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: #666;
    font-size: calc(var(--font-size) * 0.95);
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #666;
    margin-top: 2px;
    font-weight: 300;
  }
  .work-achievements { padding-left: 20px; margin-top: 4px; }
  .work-achievements li { color: #666; font-weight: 300; }
  .proj-tech { color: #999; font-size: calc(var(--font-size) * 0.9); margin-top: 2px; }
  .skill-cat { margin-bottom: 3px; color: #555; }
  .skill-name { font-weight: 500; color: #333; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 3px; color: #555; }
  .honor-date, .rec-contact { color: #999; font-size: calc(var(--font-size) * 0.9); }
  .interests { color: #666; }
  .social-link { color: var(--accent-color); }
  .fallback-row { color: #666; margin-bottom: 2px; }
  .fallback-key { font-weight: 500; color: #444; }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
