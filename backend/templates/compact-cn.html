<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #000000;
    background: #ffffff;
    padding: var(--margin);
  }
  .resume-container { width: 100%; }

  /* ── 头部 ── */
  .basic-header { padding-bottom: 16px; margin-bottom: var(--section-spacing); }
  .basic-name { font-size: calc(var(--font-size) * 1.7); font-weight: 700; letter-spacing: 2px; color: #000000; }
  .basic-job-title { color: var(--accent-color); font-weight: 700; font-size: calc(var(--font-size) * 1.1); margin-top: 4px; }
  .basic-contact { color: #333333; font-size: calc(var(--font-size) * 0.95); margin-top: 6px; line-height: 1.8; }
  .basic-links { color: #333333; font-size: calc(var(--font-size) * 0.95); margin-top: 3px; }
  .basic-links a { color: var(--accent-color); text-decoration: none; }
  .basic-summary { color: #333333; margin-top: 8px; font-size: calc(var(--font-size) * 0.98); }
  .basic-custom-fields { color: #333333; font-size: calc(var(--font-size) * 0.95); margin-top: 3px; }

  /* ── 章节 ── */
  .module { margin-bottom: var(--section-spacing); padding-bottom: 8px; break-inside: avoid; }
  /* 后端 basic_info 也包 .module，隐藏其标题以对齐前端（前端不渲染 basic_info 标题） */
  .module-basic_info .module-title { display: none; }
  .module-title {
    font-size: calc(var(--font-size) * 1.05);
    color: #000000;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .module-title::after { content: ""; flex: 1; height: 2px; background: var(--accent-color); opacity: 0.35; }
  .module-content { padding-left: 2px; }

  /* ── 条目 ── */
  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: calc(var(--section-spacing) * 1.1); break-inside: avoid; }
  .edu-header, .work-header, .proj-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .edu-school, .work-company, .proj-name, .club-name { font-weight: 600; color: #000000; font-size: calc(var(--font-size) * 1.02); }
  .edu-date, .work-date, .proj-date, .club-date { color: #333333; font-size: calc(var(--font-size) * 0.88); white-space: nowrap; }
  .edu-info, .work-position, .proj-role, .club-role { color: var(--accent-color); font-size: calc(var(--font-size) * 0.95); font-weight: 500; margin-top: 2px; }
  .work-desc, .proj-desc, .edu-desc, .club-desc { color: #333333; margin-top: 3px; text-align: justify; }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #333333; }
  .work-achievements li { margin-bottom: 2px; }

  /* ── 技能 ── */
  .skill-cat { margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; }
  .skill-name { font-weight: 600; color: #000000; min-width: 88px; }
  .skill-item { display:inline-block; background:none; border:none; color:#000000; border-radius:0; padding:0; margin:0 8px 0 0; font-size:calc(var(--font-size) * 0.95); }
  .proj-tech { color: #333333; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #333333; }
  .honor-date, .rec-contact { color: #333333; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #333333; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 600; color: #000000; }
  .other-title, .custom-title { font-weight: 600; color: #000000; margin-bottom: 3px; }
  .other-content, .custom-content { color: #333333; }
  .pub-title { font-weight: 600; color: #000000; }
  .pub-authors { color: #333333; font-size: calc(var(--font-size) * 0.95); }
  .pub-info { color: #333333; font-size: calc(var(--font-size) * 0.88); }

   .basic-header::after { content:""; display:block; width:52px; height:3px; background:var(--accent-color); border-radius:2px; margin-top:10px; }
.skill-item { display:inline-block; background:none; border:none; color:#000000; border-radius:0; padding:0; margin:0 8px 0 0; font-size:calc(var(--font-size) * 0.95); }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
