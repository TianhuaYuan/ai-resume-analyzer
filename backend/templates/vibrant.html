<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #374151;
    background: #f8fafc;
  }

  /* ── 顶部：明亮渐变带 ── */
  .basic-header {
    background: linear-gradient(120deg, var(--accent-color) 0%, #7c3aed 100%);
    color: #fff;
    padding: 34px var(--margin) 30px;
    border-radius: 0 0 24px 24px;
  }
  .basic-name {
    font-size: calc(var(--font-size) * 2);
    font-weight: 800;
    letter-spacing: 2px;
  }
  .basic-job-title {
    font-size: calc(var(--font-size) * 1.1);
    font-weight: 600;
    opacity: 0.95;
    margin-top: 6px;
  }
  .basic-contact {
    font-size: calc(var(--font-size) * 0.92);
    opacity: 0.9;
    margin-top: 10px;
    line-height: 1.9;
  }
  .basic-summary {
    font-size: calc(var(--font-size) * 0.95);
    opacity: 0.95;
    margin-top: 8px;
    text-align: justify;
  }

  /* ── 主体：圆角卡片区块 ── */
  .resume-body { padding: var(--section-spacing) var(--margin) 0; }
  .module {
    margin-bottom: var(--section-spacing);
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    padding: 18px 20px;
    break-inside: avoid;
  }
  .module-title {
    font-size: calc(var(--font-size) * 1.15);
    font-weight: 800;
    margin-bottom: 12px;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    /* color-mix 仅现代浏览器支持，WeasyPrint 用固定色回退 */
    background: #eef2ff;
    background: color-mix(in srgb, var(--accent-color) 14%, transparent);
    color: var(--accent-color);
  }
  .module-content { padding-left: 2px; }

  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: 14px; break-inside: avoid; }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 700; color: #111827;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #9ca3af; font-size: calc(var(--font-size) * 0.88); white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color); font-weight: 600; font-size: calc(var(--font-size) * 0.95); margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #4b5563; margin-top: 3px; text-align: justify;
  }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #4b5563; }
  .work-achievements li { margin-bottom: 2px; }

  .skill-cat { margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; }
  .skill-name { font-weight: 700; color: #111827; min-width: 80px; }
  .skill-item {
    display: inline-block;
    background: #eef2ff;
    background: color-mix(in srgb, var(--accent-color) 12%, white);
    color: var(--accent-color);
    border-radius: 999px;
    padding: 1px 12px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.9);
    font-weight: 500;
  }

  .proj-tech { color: #6b7280; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #4b5563; }
  .honor-date, .rec-contact { color: #9ca3af; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #4b5563; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 700; }
</style>
</head>
<body>
<div class="basic-header">
  {{basic_header}}
</div>
<div class="resume-body">
{{modules}}
</div>
</body>
</html>
