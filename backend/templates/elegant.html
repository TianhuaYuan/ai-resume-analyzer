<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: var(--margin); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "Noto Serif CJK SC", "Songti SC", serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #3f3f46;
    background: #fff;
    padding: var(--margin);
  }
  .resume-container { max-width: 760px; margin: 0 auto; }

  /* ── 头部：居中姓名 + 细分隔线 ── */
  .basic-header {
    text-align: center;
    padding-bottom: 16px;
    margin-bottom: var(--section-spacing);
    border-bottom: 1px solid #d4d4d8;
  }
  .basic-name {
    font-size: calc(var(--font-size) * 2);
    font-weight: 600;
    letter-spacing: 6px;
    color: #27272a;
  }
  .basic-job-title {
    color: var(--accent-color);
    font-weight: 500;
    letter-spacing: 2px;
    margin-top: 6px;
    font-size: calc(var(--font-size) * 1.05);
  }
  .basic-contact {
    color: #71717a;
    font-size: calc(var(--font-size) * 0.9);
    margin-top: 8px;
  }
  .basic-summary {
    color: #52525b;
    margin-top: 8px;
    font-size: calc(var(--font-size) * 0.95);
    text-align: justify;
  }

  /* ── 章节：细线标题 ── */
  .module { margin-bottom: var(--section-spacing); break-inside: avoid; }
  .module-title {
    font-size: calc(var(--font-size) * 1.1);
    color: #27272a;
    font-weight: 600;
    letter-spacing: 3px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e4e4e7;
    text-transform: uppercase;
  }
  .module-content { padding-left: 0; }

  /* ── 条目 ── */
  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: 14px; break-inside: avoid; }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 600; color: #27272a;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #a1a1aa; font-size: calc(var(--font-size) * 0.88); white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color); font-weight: 500; font-size: calc(var(--font-size) * 0.95); margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #52525b; margin-top: 3px; text-align: justify;
  }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #52525b; }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }

  /* ── 技能：细线分隔 ── */
  .skill-cat { margin-bottom: 6px; }
  .skill-name { font-weight: 600; color: #27272a; margin-right: 8px; }
  .skill-item {
    display: inline-block;
    color: #52525b;
    border: 1px solid #d4d4d8;
    border-radius: 2px;
    padding: 1px 8px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.9);
  }

  .proj-tech { color: #71717a; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #52525b; }
  .honor-date, .rec-contact { color: #a1a1aa; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #52525b; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 600; }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
