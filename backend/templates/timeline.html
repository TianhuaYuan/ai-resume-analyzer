<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #374151;
    background: #fff;
    padding: 28px 36px;
  }

  /* ── 头部姓名区 ── */
  .module-basic_info { margin-bottom: 26px; }
  .basic-name {
    font-size: calc(var(--font-size) * 2.1);
    font-weight: 700;
    color: #111827;
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    font-size: calc(var(--font-size) * 1.1);
    margin-bottom: 8px;
  }
  .basic-contact {
    color: #6b7280;
    font-size: calc(var(--font-size) * 0.92);
    padding-bottom: 14px;
    border-bottom: 2px solid #111827;
  }
  .basic-summary { color: #4b5563; margin-top: 10px; text-align: justify; }
  .basic-links a, .basic-custom-fields span { color: #4b5563; font-size: calc(var(--font-size) * 0.92); }

  /* ── 时间轴主区 ── */
  .module { margin-bottom: 24px; break-inside: avoid; }
  .module-title {
    font-size: calc(var(--font-size) * 1.18);
    font-weight: 700;
    color: #111827;
    letter-spacing: 2px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .module-title::before {
    content: "";
    width: 10px;
    height: 10px;
    background: var(--accent-color);
    border-radius: 2px;
  }
  .module-content {
    position: relative;
    border-left: 2px solid #e5e7eb;
    padding-left: 22px;
    margin-left: 4px;
  }
  .edu-item, .work-item, .proj-item, .club-item {
    position: relative;
    margin-bottom: 16px;
    padding-bottom: 2px;
    break-inside: avoid;
  }
  .edu-item::before, .work-item::before, .proj-item::before, .club-item::before {
    content: "";
    position: absolute;
    left: -28px;
    top: 6px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent-color);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--accent-color);
  }
  .edu-header, .work-header, .proj-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .edu-school, .work-company, .proj-name {
    font-weight: 700;
    color: #111827;
  }
  .edu-date, .work-date, .proj-date {
    color: #9ca3af;
    font-size: calc(var(--font-size) * 0.88);
    white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role {
    color: var(--accent-color);
    font-weight: 500;
    font-size: calc(var(--font-size) * 0.95);
    margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #4b5563;
    margin-top: 4px;
    text-align: justify;
  }
  .work-achievements { padding-left: 20px; margin-top: 4px; color: #4b5563; }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }
  .proj-tech { color: #6b7280; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .proj-url { color: var(--accent-color); font-size: calc(var(--font-size) * 0.9); margin-top: 2px; }

  /* ── 技能/其他 ── */
  .skill-cat { margin-bottom: 8px; }
  .skill-name { font-weight: 600; color: #111827; margin-right: 6px; }
  .skill-item {
    display: inline-block;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 3px;
    padding: 1px 8px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.88);
    color: #374151;
  }
  .lang-item, .cert-item, .honor-item, .rec-item {
    margin-bottom: 5px;
    color: #374151;
  }
  .lang-item strong, .cert-item strong, .rec-item strong { color: #111827; }
  .honor-date, .rec-contact { color: #9ca3af; font-size: calc(var(--font-size) * 0.9); }
  .honor-desc { color: #4b5563; }
  .interests { color: #4b5563; }
  .other-title, .custom-title { font-weight: 600; color: #111827; }
  .other-content, .custom-content { color: #4b5563; }
  .fallback-row { color: #4b5563; margin-bottom: 3px; }
  .fallback-key { font-weight: 600; }
</style>
</head>
<body>
{{modules}}
</body>
</html>
