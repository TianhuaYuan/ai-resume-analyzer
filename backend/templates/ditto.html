<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #1f2937;
    background: #f9fafb;
    padding: var(--margin);
  }
  .resume-container { width: 100%; }

  /* ── 每个模块 = 独立卡片 ── */
  .module {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    margin-bottom: var(--section-spacing);
    break-inside: avoid;
  }
  .module-basic_info .module-title { display: none; }
  .module-title {
    font-size: calc(var(--font-size) * 1.1);
    color: #1f2937;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .module-title::after { display: none; }
  .module-content { padding-left: 0; }

  /* ── 头部 ── */
  .basic-header { margin-bottom: 4px; padding-bottom: 8px; }
  .basic-name { font-size: calc(var(--font-size) * 1.8); font-weight: 700; letter-spacing: 1px; color: #1f2937; }
  .basic-job-title { color: var(--accent-color); font-weight: 600; font-size: calc(var(--font-size) * 1.1); margin-top: 2px; }
  .basic-contact { color: #6b7280; font-size: calc(var(--font-size) * 0.95); margin-top: 5px; line-height: 1.8; }
  .basic-links { color: #6b7280; font-size: calc(var(--font-size) * 0.95); margin-top: 3px; }
  .basic-links a { color: var(--accent-color); text-decoration: none; }
  .basic-summary { color: #6b7280; margin-top: 7px; font-size: calc(var(--font-size) * 0.98); }
  .basic-custom-fields { color: #6b7280; font-size: calc(var(--font-size) * 0.95); margin-top: 3px; }

  /* ── 条目 ── */
  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: calc(var(--section-spacing) * 1.1); break-inside: avoid; }
  .edu-header, .work-header, .proj-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .edu-school, .work-company, .proj-name, .club-name { font-weight: 600; color: #1f2937; font-size: calc(var(--font-size) * 1.02); }
  .edu-date, .work-date, .proj-date, .club-date { color: #6b7280; font-size: calc(var(--font-size) * 0.88); white-space: nowrap; }
  .edu-info, .work-position, .proj-role, .club-role { color: var(--accent-color); font-size: calc(var(--font-size) * 0.95); font-weight: 500; margin-top: 2px; }
  .work-desc, .proj-desc, .edu-desc, .club-desc { color: #6b7280; margin-top: 3px; text-align: justify; }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #6b7280; }
  .work-achievements li { margin-bottom: 2px; }

  /* ── 技能 ── */
  .skill-cat { margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; }
  .skill-name { font-weight: 600; color: #1f2937; min-width: 88px; }
  .skill-item { display:inline-block; background:rgba(15,23,42,0.06); border:none; color:var(--accent-color); border-radius:999px; padding:2px 12px; margin:2px 6px 2px 0; font-size:calc(var(--font-size) * 0.92); }
  .proj-tech { color: #6b7280; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #6b7280; }
  .honor-date, .rec-contact { color: #6b7280; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #6b7280; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 600; color: #1f2937; }
  .other-title, .custom-title { font-weight: 600; color: #1f2937; margin-bottom: 3px; }
  .other-content, .custom-content { color: #6b7280; }
  .pub-title { font-weight: 600; color: #1f2937; }
  .pub-authors { color: #6b7280; font-size: calc(var(--font-size) * 0.95); }
  .pub-info { color: #6b7280; font-size: calc(var(--font-size) * 0.88); }

   .basic-header::after { content:""; display:block; width:52px; height:3px; background:var(--accent-color); border-radius:2px; margin-top:10px; }
 .module-title::after { display: none; }
.skill-item { display:inline-block; background:rgba(15,23,42,0.06); border:none; color:var(--accent-color); border-radius:999px; padding:2px 12px; margin:2px 6px 2px 0; font-size:calc(var(--font-size) * 0.92); }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
