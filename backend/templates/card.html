<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #3f3f46;
    background: #fff;
    padding: 28px 32px;
  }

  /* ── 头部姓名区 ── */
  .module-basic_info {
    background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 20px;
    color: #e5e7eb;
  }
  .module-basic_info .basic-name {
    font-size: calc(var(--font-size) * 1.9);
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .module-basic_info .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    font-size: calc(var(--font-size) * 1.05);
    margin-bottom: 10px;
  }
  .module-basic_info .basic-contact { color: #d1d5db; font-size: calc(var(--font-size) * 0.92); }
  .module-basic_info .basic-links a { color: #9ca3af; }
  .module-basic_info .basic-summary { color: #cbd5e1; margin-top: 10px; text-align: justify; }
  .module-basic_info .basic-custom-fields span { color: #cbd5e1; }
  .module-basic_info .basic-custom-fields b { color: var(--accent-color); }

  /* ── 卡片化模块 ── */
  .module {
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-left: 4px solid var(--accent-color);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 18px;
    break-inside: avoid;
  }
  .module-title {
    font-size: calc(var(--font-size) * 1.1);
    color: #18181b;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .module-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e4e4e7;
  }

  /* ── 条目 ── */
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: 15px;
    break-inside: avoid;
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 700;
    color: #18181b;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #a1a1aa;
    font-size: calc(var(--font-size) * 0.88);
    white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color);
    font-weight: 500;
    font-size: calc(var(--font-size) * 0.95);
    margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #52525b;
    margin-top: 4px;
    text-align: justify;
  }
  .work-achievements { padding-left: 20px; margin-top: 4px; color: #52525b; }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }
  .proj-tech { color: #71717a; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .proj-url { color: var(--accent-color); font-size: calc(var(--font-size) * 0.9); margin-top: 2px; }

  /* ── 技能标签 ── */
  .skill-cat { margin-bottom: 8px; }
  .skill-name { font-weight: 600; color: #18181b; margin-right: 6px; }
  .skill-item {
    display: inline-block;
    background: #fff;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    padding: 1px 10px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.88);
    color: #3f3f46;
  }

  /* ── 其他 ── */
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 5px; color: #52525b; }
  .lang-item strong, .cert-item strong, .rec-item strong { color: #18181b; }
  .honor-date, .rec-contact { color: #a1a1aa; font-size: calc(var(--font-size) * 0.9); }
  .honor-desc { color: #52525b; }
  .interests { color: #52525b; }
  .other-title, .custom-title { font-weight: 600; color: #18181b; }
  .other-content, .custom-content { color: #52525b; }
  .fallback-row { color: #52525b; margin-bottom: 3px; }
  .fallback-key { font-weight: 600; }
</style>
</head>
<body>
{{modules}}
</body>
</html>
