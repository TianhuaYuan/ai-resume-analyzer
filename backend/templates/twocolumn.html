<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #334155;
    background: #fff;
  }

  /* ── 两栏：浅色侧栏 + 主内容 ── */
  .resume-layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 252px;
    flex-shrink: 0;
    background: #f8fafc;
    border-right: 1px solid #e2e8f0;
    padding: 34px 22px;
  }
  .main { flex: 1; padding: 34px 30px; }

  /* ── 侧栏 ── */
  .sidebar .module { margin-bottom: 24px; }
  .sidebar .module-title {
    color: #0f172a;
    font-size: calc(var(--font-size) * 1.02);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--accent-color);
  }
  .sidebar .basic-name {
    font-size: calc(var(--font-size) * 1.55);
    font-weight: 700;
    color: #0f172a;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .sidebar .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .sidebar .basic-contact, .sidebar .basic-summary, .sidebar .interests,
  .sidebar .social-link, .sidebar .lang-item, .sidebar .fallback-row {
    color: #475569;
    font-size: calc(var(--font-size) * 0.92);
    line-height: 1.9;
  }
  .sidebar .basic-contact span { display: block; }
  .sidebar .basic-summary { margin-top: 6px; text-align: justify; }
  .sidebar .skill-cat { display: block; margin-bottom: 9px; }
  .sidebar .skill-name {
    color: #64748b;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
    font-size: calc(var(--font-size) * 0.92);
  }
  .sidebar .skill-item {
    display: inline-block;
    color: #334155;
    background: #fff;
    border: 1px solid var(--accent-color);
    color: var(--accent-color);
    border-radius: 12px;
    padding: 1px 9px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.85);
  }
  .sidebar .basic-links a { color: var(--accent-color); }

  /* ── 主内容区 ── */
  .main .module { margin-bottom: 24px; break-inside: avoid; }
  .main .module-title {
    font-size: calc(var(--font-size) * 1.15);
    color: #0f172a;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .main .module-title::before {
    content: "";
    width: 4px;
    height: 16px;
    background: var(--accent-color);
    border-radius: 2px;
  }
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: 18px;
    break-inside: avoid;
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 700;
    color: #0f172a;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #94a3b8;
    font-size: calc(var(--font-size) * 0.88);
    white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color);
    font-weight: 500;
    font-size: calc(var(--font-size) * 0.95);
    margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #475569;
    margin-top: 4px;
    text-align: justify;
  }
  .work-achievements { padding-left: 20px; margin-top: 4px; color: #475569; }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }
  .proj-tech { color: #64748b; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .proj-url { color: var(--accent-color); font-size: calc(var(--font-size) * 0.9); margin-top: 2px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 5px; color: #475569; }
  .honor-date, .rec-contact { color: #94a3b8; font-size: calc(var(--font-size) * 0.9); }
  .fallback-row { color: #475569; margin-bottom: 3px; }
  .fallback-key { font-weight: 600; }
</style>
</head>
<body>
<div class="resume-layout">
  <div class="sidebar">
    {{sidebar}}
  </div>
  <div class="main">
    {{modules}}
  </div>
</div>
</body>
</html>
