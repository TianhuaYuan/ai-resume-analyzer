<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #2d3748;
    background: #fff;
  }

  /* ── 双栏布局：左侧深色侧栏 + 右侧主内容 ── */
  .resume-layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #1a202c 0%, #2d3748 100%);
    color: #cbd5e0;
    padding: 32px 22px;
  }
  .main { flex: 1; padding: 32px 30px; }

  /* ── 侧栏样式 ── */
  .sidebar .module { margin-bottom: 22px; }
  .sidebar .module-title {
    color: #fff;
    font-size: calc(var(--font-size) * 1.05);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  .sidebar .basic-name {
    font-size: calc(var(--font-size) * 1.7);
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .sidebar .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    margin-bottom: 10px;
    font-size: calc(var(--font-size) * 1.05);
  }
  .sidebar .basic-contact, .sidebar .basic-summary, .sidebar .interests,
  .sidebar .social-link, .sidebar .lang-item, .sidebar .fallback-row {
    color: #cbd5e0;
    font-size: calc(var(--font-size) * 0.92);
    line-height: 1.9;
  }
  .sidebar .basic-summary { margin-top: 6px; text-align: justify; }
  .sidebar .skill-cat { display: block; margin-bottom: 8px; }
  .sidebar .skill-name {
    color: #a0aec0;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }
  .sidebar .skill-item {
    display: inline-block;
    color: #e2e8f0;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    padding: 1px 8px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.88);
  }

  /* ── 主内容区样式 ── */
  .main .module { margin-bottom: 22px; break-inside: avoid; }
  .main .module-title {
    font-size: calc(var(--font-size) * 1.15);
    color: #1a202c;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .main .module-title::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--accent-color);
    opacity: 0.4;
  }
  .main .module-content { padding-left: 2px; }
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: 16px;
    break-inside: avoid;
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 600;
    color: #1a202c;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #a0aec0;
    font-size: calc(var(--font-size) * 0.88);
    white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color);
    font-weight: 500;
    font-size: calc(var(--font-size) * 0.95);
    margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #4a5568;
    margin-top: 3px;
    text-align: justify;
  }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #4a5568; }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }
  .proj-tech { color: #718096; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #4a5568; }
  .honor-date, .rec-contact { color: #a0aec0; font-size: calc(var(--font-size) * 0.9); }
  .fallback-row { color: #4a5568; margin-bottom: 3px; }
  .fallback-key { font-weight: 600; }
</style>
</head>
<body>
<div class="resume-layout">
  <div class="sidebar">
    {{sidebar}}
  </div>
  <div class="main">
    {{modules}}
  </div>
</div>
</body>
</html>
