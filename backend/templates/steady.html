<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "Noto Serif CJK SC", "SimSun", serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #2f3037;
    background: #fff;
  }

  /* ── 顶部深色头带：姓名 + 求职意向 + 联系方式 ── */
  .basic-header {
    background: linear-gradient(135deg, #1c2333 0%, #2d3a52 100%);
    color: #e5e7eb;
    padding: 34px var(--margin) 28px;
  }
  .basic-name {
    font-size: calc(var(--font-size) * 1.9);
    font-weight: 700;
    color: #fff;
    letter-spacing: 3px;
  }
  .basic-job-title {
    color: var(--accent-color);
    font-weight: 600;
    font-size: calc(var(--font-size) * 1.08);
    margin-top: 6px;
  }
  .basic-contact {
    color: #cbd5e1;
    font-size: calc(var(--font-size) * 0.92);
    margin-top: 10px;
    line-height: 1.9;
  }
  .basic-summary {
    color: #cbd5e1;
    margin-top: 8px;
    font-size: calc(var(--font-size) * 0.95);
    text-align: justify;
  }

  /* ── 主体内容 ── */
  .resume-body { padding: var(--section-spacing) var(--margin) 0; }
  .module { margin-bottom: var(--section-spacing); break-inside: avoid; }
  .module-title {
    font-size: calc(var(--font-size) * 1.12);
    color: #1c2333;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
    padding-left: 10px;
    border-left: 4px solid var(--accent-color);
  }
  .module-content { padding-left: 10px; }

  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: 14px; break-inside: avoid; }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 700; color: #1c2333;
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #9ca3af; font-size: calc(var(--font-size) * 0.88); white-space: nowrap;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color); font-weight: 600; font-size: calc(var(--font-size) * 0.95); margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #4b5563; margin-top: 3px; text-align: justify;
  }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #4b5563; }
  .work-achievements li { margin-bottom: 2px; }

  .skill-cat { margin-bottom: 6px; }
  .skill-name { font-weight: 700; color: #1c2333; margin-right: 8px; }
  .skill-item {
    display: inline-block;
    background: #1c2333;
    color: #e5e7eb;
    border-radius: 2px;
    padding: 1px 10px;
    margin: 2px 4px 2px 0;
    font-size: calc(var(--font-size) * 0.9);
  }

  .proj-tech { color: #6b7280; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #4b5563; }
  .honor-date, .rec-contact { color: #9ca3af; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #4b5563; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 700; }
</style>
</head>
<body>
<div class="basic-header">
  {{basic_header}}
</div>
<div class="resume-body">
{{modules}}
</div>
</body>
</html>
