<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #0f172a;
    background: #ffffff;
    padding: var(--margin);
  }
  .resume-container { width: 100%; }

  /* ── 头部 ── */
  .basic-header { padding-bottom: 16px; margin-bottom: var(--section-spacing); }
  .basic-name { font-size: calc(var(--font-size) * 1.8); font-weight: 700; letter-spacing: 2px; color: #0f172a; }
  .basic-job-title { color: var(--accent-color); font-weight: 600; font-size: calc(var(--font-size) * 1.1); margin-top: 4px; }
  .basic-contact { color: #4b5563; font-size: calc(var(--font-size) * 0.95); margin-top: 6px; line-height: 1.8; }
  .basic-links { color: #4b5563; font-size: calc(var(--font-size) * 0.95); margin-top: 3px; }
  .basic-links a { color: var(--accent-color); text-decoration: none; }
  .basic-summary { color: #4b5563; margin-top: 8px; font-size: calc(var(--font-size) * 0.98); }
  .basic-custom-fields { color: #4b5563; font-size: calc(var(--font-size) * 0.95); margin-top: 3px; }

  /* ── 章节 ── */
  .module { margin-bottom: var(--section-spacing); padding-bottom: 8px; break-inside: avoid; }
  .module-basic_info .module-title { display: none; }
  .module-title {
    font-size: calc(var(--font-size) * 1.1);
    color: #0f172a;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .module-title::after { display: none; }
  .module-content { padding-left: 0; }

  /* ── 时间轴：仅经历类模块 ── */
  .module-education .module-content, .module-work_experience .module-content,
  .module-project_experience .module-content, .module-club_activities .module-content {
    position: relative;
    padding-left: 20px;
  }
  .module-education .module-content::before, .module-work_experience .module-content::before,
  .module-project_experience .module-content::before, .module-club_activities .module-content::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background: var(--accent-color);
    opacity: 0.35;
  }
  .module-education .edu-item, .module-work_experience .work-item,
  .module-project_experience .proj-item, .module-club_activities .club-item {
    position: relative;
  }
  .module-education .edu-item::before, .module-work_experience .work-item::before,
  .module-project_experience .proj-item::before, .module-club_activities .club-item::before {
    content: "";
    position: absolute;
    left: -17px;
    top: 6px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--accent-color);
  }

  /* ── 条目 ── */
  .edu-item, .work-item, .proj-item, .club-item { margin-bottom: calc(var(--section-spacing) * 1.1); break-inside: avoid; }
  .edu-header, .work-header, .proj-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .edu-school, .work-company, .proj-name, .club-name { font-weight: 600; color: #0f172a; font-size: calc(var(--font-size) * 1.02); }
  .edu-date, .work-date, .proj-date, .club-date { color: #4b5563; font-size: calc(var(--font-size) * 0.88); white-space: nowrap; }
  .edu-info, .work-position, .proj-role, .club-role { color: var(--accent-color); font-size: calc(var(--font-size) * 0.95); font-weight: 500; margin-top: 2px; }
  .work-desc, .proj-desc, .edu-desc, .club-desc { color: #4b5563; margin-top: 3px; text-align: justify; }
  .work-achievements { padding-left: 22px; margin-top: 4px; color: #4b5563; }
  .work-achievements li { margin-bottom: 2px; }

  /* ── 技能 ── */
  .skill-cat { margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; }
  .skill-name { font-weight: 600; color: #0f172a; min-width: 88px; }
  .skill-item { display:inline-block; background:rgba(15,23,42,0.05); border:1px solid rgba(15,23,42,0.12); color:var(--accent-color); border-radius:4px; padding:1px 8px; margin:2px 4px 2px 0; font-size:calc(var(--font-size) * 0.92); }
  .proj-tech { color: #4b5563; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 4px; color: #4b5563; }
  .honor-date, .rec-contact { color: #4b5563; font-size: calc(var(--font-size) * 0.9); }
  .interests, .social-link, .fallback-row { color: #4b5563; }
  .fallback-row { margin-bottom: 3px; }
  .fallback-key { font-weight: 600; color: #0f172a; }
  .other-title, .custom-title { font-weight: 600; color: #0f172a; margin-bottom: 3px; }
  .other-content, .custom-content { color: #4b5563; }
  .pub-title { font-weight: 600; color: #0f172a; }
  .pub-authors { color: #4b5563; font-size: calc(var(--font-size) * 0.95); }
  .pub-info { color: #4b5563; font-size: calc(var(--font-size) * 0.88); }

   .basic-header::after { content:""; display:block; width:52px; height:3px; background:var(--accent-color); border-radius:2px; margin-top:10px; }
 .module-title::after { display: none; }
.skill-item { display:inline-block; background:rgba(15,23,42,0.05); border:1px solid rgba(15,23,42,0.12); color:var(--accent-color); border-radius:4px; padding:1px 8px; margin:2px 4px 2px 0; font-size:calc(var(--font-size) * 0.92); }
</style>
</head>
<body>
<div class="resume-container">
{{modules}}
</div>
</body>
</html>
