<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{filename}}</title>
<style>
  @page { size: var(--page-size); margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-family), "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #1c1917;
    background: #fff;
    padding: 34px 40px;
  }

  /* ── 头部：编辑杂志式大姓名区 ── */
  .module-basic_info { margin-bottom: 28px; }
  .basic-name {
    font-size: calc(var(--font-size) * 2.4);
    font-weight: 800;
    color: #111;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .basic-job-title {
    color: var(--accent-color);
    font-weight: 700;
    font-size: calc(var(--font-size) * 1.15);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .basic-contact {
    color: #57534e;
    font-size: calc(var(--font-size) * 0.95);
    letter-spacing: 0.5px;
    border-top: 1px solid #d6d3d1;
    border-bottom: 1px solid #d6d3d1;
    padding: 8px 0;
  }
  .basic-summary {
    color: #44403c;
    margin-top: 12px;
    text-align: justify;
    font-size: calc(var(--font-size) * 1.02);
  }
  .basic-links a { color: var(--accent-color); }
  .basic-custom-fields span { color: #57534e; }
  .basic-custom-fields b { color: var(--accent-color); }

  /* ── 模块：粗分隔线标题 ── */
  .module { margin-bottom: 26px; break-inside: avoid; }
  .module-title {
    font-size: calc(var(--font-size) * 1.25);
    color: #111;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 3px solid #111;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .module-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--accent-color);
  }

  /* ── 条目 ── */
  .edu-item, .work-item, .proj-item, .club-item {
    margin-bottom: 18px;
    break-inside: avoid;
  }
  .edu-header, .work-header, .proj-header, .club-item > div:first-child {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .edu-school, .work-company, .proj-name, .club-name {
    font-weight: 700;
    color: #111;
    font-size: calc(var(--font-size) * 1.05);
  }
  .edu-date, .work-date, .proj-date, .club-date {
    color: #a8a29e;
    font-size: calc(var(--font-size) * 0.88);
    white-space: nowrap;
    font-style: italic;
  }
  .edu-info, .work-position, .proj-role, .club-role {
    color: var(--accent-color);
    font-weight: 600;
    font-size: calc(var(--font-size) * 0.95);
    margin-top: 2px;
  }
  .work-desc, .proj-desc, .edu-desc, .club-desc {
    color: #44403c;
    margin-top: 5px;
    text-align: justify;
  }
  .work-achievements { padding-left: 20px; margin-top: 4px; color: #44403c; }
  .work-achievements li { margin-bottom: 2px; text-align: justify; }
  .proj-tech { color: #78716c; font-size: calc(var(--font-size) * 0.9); margin-top: 3px; }
  .proj-url { color: var(--accent-color); font-size: calc(var(--font-size) * 0.9); margin-top: 2px; }

  /* ── 技能：下划线标签 ── */
  .skill-cat { margin-bottom: 8px; }
  .skill-name { font-weight: 700; color: #111; margin-right: 6px; }
  .skill-item {
    display: inline-block;
    border-bottom: 2px solid var(--accent-color);
    padding: 0 2px 1px;
    margin: 2px 8px 2px 0;
    font-size: calc(var(--font-size) * 0.92);
    color: #292524;
  }

  /* ── 其他 ── */
  .lang-item, .cert-item, .honor-item, .rec-item { margin-bottom: 6px; color: #44403c; }
  .lang-item strong, .cert-item strong, .rec-item strong { color: #111; }
  .honor-date, .rec-contact { color: #a8a29e; font-size: calc(var(--font-size) * 0.9); }
  .honor-desc { color: #44403c; }
  .interests { color: #44403c; letter-spacing: 1px; }
  .other-title, .custom-title { font-weight: 700; color: #111; }
  .other-content, .custom-content { color: #44403c; }
  .fallback-row { color: #44403c; margin-bottom: 3px; }
  .fallback-key { font-weight: 700; }
</style>
</head>
<body>
{{modules}}
</body>
</html>
