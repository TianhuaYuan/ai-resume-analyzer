[project]
name = "ai-resume-analyzer-backend"
version = "0.1.0"
description = "AI 简历分析系统后端"
requires-python = ">=3.11"

# =============================================================================
# Pytest 配置
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 把 backend/ 加入 sys.path，使 `from core...` / `from main...` 可解析
pythonpath = ["."]
markers = [
    "integration: marks tests that require external services (ChromaDB/LLM/API keys)",
]

# =============================================================================
# Alembic 配置
# =============================================================================
[tool.alembic]
# 迁移脚本目录
script_location = "alembic"

# 文件名模板
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# sys.path 预置
prepend_sys_path = "."

# 时区
# timezone = ""

# slug 最大长度
# truncate_slug_length = 40

# revision 时是否运行环境
# revision_environment = false

# 是否允许无源文件的 .pyc/.pyo
# sourceless = false

# 版本位置
# version_locations = ""

# 路径分隔符
path_separator = "os"

# 是否递归搜索版本目录
# recursive_version_locations = false

# 输出编码
# output_encoding = "utf-8"

# 数据库 URL（会被 env.py 中的配置覆盖）
sqlalchemy.url = "driver://user:pass@localhost/dbname"

# =============================================================================
# Alembic 日志配置
# =============================================================================
[tool.alembic.loggers]
keys = "root,sqlalchemy,alembic"

[tool.alembic.handlers]
keys = "console"

[tool.alembic.formatters]
keys = "generic"

[tool.alembic.logger_root]
level = "WARNING"
handlers = ["console"]
qualname = ""

[tool.alembic.logger_sqlalchemy]
level = "WARNING"
handlers = []
qualname = "sqlalchemy.engine"

[tool.alembic.logger_alembic]
level = "INFO"
handlers = []
qualname = "alembic"

[tool.alembic.handler_console]
class = "StreamHandler"
args = "(sys.stderr,)"
level = "NOTSET"
formatter = "generic"

[tool.alembic.formatter_generic]
format = "%(levelname)-5.5s [%(name)s] %(message)s"
datefmt = "%H:%M:%S"

# =============================================================================
# Ruff 配置（阶段11 引入；按通用规则 E/F，仅对历史目录做最小豁免）
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 使用 ruff 默认规则集（E4/E7/E9/F，不含 E501 行长度），与项目基线一致

# alembic/env.py 需在 sys.path 注入后才 import，E402 在此为合理模式
[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]
