# Prometheus 采集配置

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ai-resume-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s
    bearer_token_file: "/prometheus/metrics_token"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "development"
      # - targets: ["host.docker.internal:8000"]
      #   labels:
      #     environment: "local"

  # - job_name: "mysql"
